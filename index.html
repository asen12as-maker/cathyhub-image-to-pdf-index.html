<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CathyHub Image to PDF</title>
<meta name="description" content="Free online Image to PDF converter by CathyHub.">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>
<style>
body{font-family:Arial,sans-serif;background:#f7f4ef;color:#2b2118;margin:0}header{background:#fff;padding:18px 20px;border-bottom:1px solid #ddd}.logo{max-width:900px;margin:auto;font-size:25px;font-weight:800;color:#8b4b20}.logo span{color:#d49a43}.wrap{max-width:900px;margin:35px auto;padding:0 18px}.hero{text-align:center;margin-bottom:25px}.hero h1{font-size:38px;margin:0 0 10px}.hero p{color:#6d6259}.box{background:#fff;padding:28px;border-radius:20px;box-shadow:0 8px 30px #00000014}.upload{display:block;border:2px dashed #d6b98d;border-radius:16px;padding:40px 20px;text-align:center;background:#fffaf4;cursor:pointer}.upload-icon{font-size:48px}.upload h2{margin:10px 0}.upload p{color:#777}.btn{display:inline-block;background:#9b5524;color:#fff;padding:12px 24px;border-radius:9px;font-weight:bold}input[type=file]{display:none}.controls{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px}.control label{display:block;font-weight:bold;margin-bottom:8px}select,input[type=range]{width:100%}select{padding:12px;border:1px solid #ddd;border-radius:9px;background:#fff}.photos{margin-top:25px}.photo{display:flex;align-items:center;gap:14px;padding:12px;border:1px solid #eee;border-radius:10px;margin-bottom:10px}.photo img{width:65px;height:65px;object-fit:cover;border-radius:8px}.info{flex:1;overflow:hidden}.name{font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.size{font-size:13px;color:#777;margin-top:4px}.remove{border:0;background:#eee;color:#a33;padding:8px 12px;border-radius:7px}.actions{display:flex;gap:12px;margin-top:25px}.create{flex:1;border:0;background:#9b5524;color:#fff;padding:14px;border-radius:10px;font-weight:bold;font-size:15px}.clear{border:0;background:#eee;padding:14px 20px;border-radius:10px;font-size:15px}.status{text-align:center;margin-top:18px;color:#666;min-height:22px}.privacy{margin-top:25px;padding:20px;background:#fff8ed;border-radius:14px;line-height:1.6}footer{text-align:center;padding:30px;color:#777;font-size:14px}@media(max-width:600px){.hero h1{font-size:29px}.box{padding:18px}.controls{grid-template-columns:1fr}.actions{flex-direction:column}}
</style></head>
<body><header><div class="logo">Cathy<span>Hub</span></div></header>
<div class="wrap"><div class="hero"><h1>Image to PDF</h1><p>Convert JPG, PNG and WEBP images into a PDF.</p></div>
<div class="box"><label class="upload" for="files"><div class="upload-icon">📄</div><h2>Select Images</h2><p>Multiple images supported</p><span class="btn">Choose Images</span></label>
<input id="files" type="file" accept="image/jpeg,image/png,image/webp" multiple>
<div class="controls"><div class="control"><label>Page Size</label><select id="size"><option value="a4">A4</option><option value="letter">Letter</option></select></div>
<div class="control"><label>Orientation</label><select id="orient"><option value="portrait">Portrait</option><option value="landscape">Landscape</option></select></div>
<div class="control"><label>Margin</label><select id="margin"><option value="0">No Margin</option><option value="5">Small</option><option value="10" selected>Normal</option><option value="20">Large</option></select></div>
<div class="control"><label>Quality: <span id="qv">90</span>%</label><input id="quality" type="range" min="50" max="100" value="90"></div></div>
<div id="photos" class="photos"></div><div class="actions"><button id="create" class="create">📄 Create PDF</button><button id="clear" class="clear">Clear</button></div>
<div id="status" class="status"></div><div class="privacy"><strong>🔒 Privacy</strong><br>Your images are processed in your browser and are not uploaded to a CathyHub server.</div></div></div>
<footer>© 2026 CathyHub • Free Online Image Tools</footer>
<script>
const F=document.getElementById('files'),P=document.getElementById('photos'),S=document.getElementById('status');let files=[];
F.onchange=()=>{files.push(...F.files);F.value='';render()};document.getElementById('quality').oninput=e=>document.getElementById('qv').textContent=e.target.value;
function render(){P.innerHTML='';files.forEach((f,i)=>{let d=document.createElement('div');d.className='photo';let u=URL.createObjectURL(f);d.innerHTML='<img src="'+u+'"><div class="info"><div class="name">'+esc(f.name)+'</div><div class="size">'+fmt(f.size)+'</div></div><button class="remove" onclick="removeFile('+i+')">Remove</button>';P.appendChild(d)})}
function removeFile(i){files.splice(i,1);render()}function fmt(b){return b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(2)+' MB'}function esc(t){let d=document.createElement('div');d.textContent=t;return d.innerHTML}
function load(f){return new Promise((res,rej)=>{let r=new FileReader();r.onload=e=>{let im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=e.target.result};r.onerror=rej;r.readAsDataURL(f)})}
document.getElementById('create').onclick=async()=>{if(!files.length){S.textContent='Please select at least one image.';return}try{S.textContent='Creating PDF...';let jsPDF=window.jspdf.jsPDF,o=document.getElementById('orient').value,p=new jsPDF({orientation:o,unit:'mm',format:document.getElementById('size').value}),m=+document.getElementById('margin').value;
for(let i=0;i<files.length;i++){let im=await load(files[i]);if(i)p.addPage();let pw=p.internal.pageSize.getWidth(),ph=p.internal.pageSize.getHeight(),aw=pw-2*m,ah=ph-2*m,r=Math.min(aw/im.naturalWidth,ah/im.naturalHeight),w=im.naturalWidth*r,h=im.naturalHeight*r;p.addImage(im,'JPEG',(pw-w)/2,(ph-h)/2,w,h,undefined,'FAST')}p.save('cathyhub-images.pdf');S.textContent='✅ PDF created and downloaded successfully!'}catch(e){console.error(e);S.textContent='❌ Could not create PDF. Please try again.'}};
document.getElementById('clear').onclick=()=>{files=[];render();S.textContent=''};
</script></body></html>
